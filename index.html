<!DOCTYPE html>
<html>
<head>
    <title>Board Game Resource Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .resource {
            background-color: white;
            max-width: 400px;
            margin: 15px auto;
            padding: 20px;
            border-radius: 10px;
        }

        .resource h2 {
            margin: 0 0 10px;
        }

        .amount {
            font-size: 32px;
            font-weight: bold;
            margin: 10px;
        }

        button {
            font-size: 24px;
            width: 50px;
            height: 45px;
            margin: 5px;
            cursor: pointer;
        }

        .reset {
            width: 150px;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Board Game Resource Tracker</h1>

    <div class="resource">
        <h2>Plastic</h2>
        <div class="amount" id="plastic">0</div>
        <button onclick="changeResource('plastic', -1)">−</button>
        <button onclick="changeResource('plastic', 1)">+</button>
    </div>

    <div class="resource">
        <h2>Plastic Storage</h2>
        <div class="amount" id="plasticStorage">0</div>
        <button onclick="changeResource('plasticStorage', -1)">−</button>
        <button onclick="changeResource('plasticStorage', 1)">+</button>
    </div>

    <div class="resource">
        <h2>Food</h2>
        <div class="amount" id="food">5</div>
        <button onclick="changeResource('food', -1)">−</button>
        <button onclick="changeResource('food', 1)">+</button>
    </div>

    <div class="resource">
        <h2>Housing</h2>
        <div class="amount" id="housing">10</div>
        <button onclick="changeResource('housing', -1)">−</button>
        <button onclick="changeResource('housing', 1)">+</button>
    </div>

    <div class="resource">
        <h2>Research Points</h2>
        <div class="amount" id="researchPoints">0</div>
        <button onclick="changeResource('researchPoints', -1)">−</button>
        <button onclick="changeResource('researchPoints', 1)">+</button>
    </div>

    <button class="reset" onclick="resetResources()">Reset Game</button>

    <script>
        let resources = {
            plastic: 0,
            plasticStorage: 0,
            food: 5,
            housing: 10,
            researchPoints: 0
        };

        function changeResource(resource, amount) {
            resources[resource] += amount;

            // Plastic cannot go below 0
            if (resource === "plastic" && resources.plastic < 0) {
                resources.plastic = 0;
            }

            // Plastic Storage cannot go below 0
            if (resource === "plasticStorage" && resources.plasticStorage < 0) {
                resources.plasticStorage = 0;
            }

            // Plastic cannot exceed Plastic Storage
            if (resources.plastic > resources.plasticStorage) {
                resources.plastic = resources.plasticStorage;
            }

            // Food cannot go below 0
            if (resource === "food" && resources.food < 0) {
                resources.food = 0;
            }

            // Research Points cannot go below 0
            if (resource === "researchPoints" && resources.researchPoints < 0) {
                resources.researchPoints = 0;
            }

            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById("plastic").textContent = resources.plastic;
            document.getElementById("plasticStorage").textContent = resources.plasticStorage;
            document.getElementById("food").textContent = resources.food;
            document.getElementById("housing").textContent = resources.housing;
            document.getElementById("researchPoints").textContent = resources.researchPoints;
        }

        function resetResources() {
            resources = {
                plastic: 0,
                plasticStorage: 0,
                food: 5,
                housing: 10,
                researchPoints: 0
            };

            updateDisplay();
        }
    </script>

</body>
</html>
